[package]
name = "fran-sync-server"
version = "0.1.0"
description = "Fran's sync server, storing end-to-end encrypted records"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[dependencies]
sync-proto = { path = "../crates/sync-proto" }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query", "ws"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite", "mysql", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["net", "sync", "time", "macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11.0"
ring = "0.17.14"
uuid = { version = "1.28.0", features = ["v4"] }
hex = "0.4.3"

# Unoptimized Argon2 makes every sign-in in the tests take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
base64 = "0.23.1"
