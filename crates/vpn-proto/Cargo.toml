[package]
name = "vpn-proto"
version = "0.1.5"
description = "Frames between Fran and its VPN worker and service"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[features]
async = ["dep:tokio"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"
tokio = { version = "1.54.1", features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt"] }
