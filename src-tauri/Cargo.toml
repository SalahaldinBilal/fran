[package]
name = "fran"
version = "0.1.5"
description = "A desktop client for databases, SSH and VPNs"
authors = ["SalahaldinBilal"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "fran_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt", "process", "fs"] }
async-trait = "0.1.92"
uuid = { version = "1.28.0", features = ["v4"] }
dirs = "7.0.0"
hex = "0.4.3"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
postgres-protocol = "0.6.12"
fallible-iterator = "0.2.0"
bytes = "1.12.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.11"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
p12-keystore = "0.4.1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
rand = "0.10.3"
ring = "0.17.14"
base64ct = { version = "1.8.3", features = ["alloc"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.1"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "column_decltype", "column_metadata"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "3.7.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
tokio-util = "0.7.20"
tauri-plugin-opener = "2.7.2"
vpn-proto = { path = "../crates/vpn-proto", features = ["async"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"
gtk = "0.18.2"

[dev-dependencies]
testcontainers = { version = "0.28.0", features = ["blocking"] }
libtest-mimic = "0.8.2"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "functions"] }
rmcp = { version = "3.7.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
